# dsh-compactor — cordis4 plugin bundle patch layer (for dsh 0.1.2-alpha.3+)
#
# This is the patch file referenced by dsh.bundle — a YAML array of loader patch
# entries (insert rows / id-targeted override rows). Applied by the dsh profile
# layer composer after dsh-base / dsh-web-app: it inserts the dsh-compactor plugin
# with its full config, and re-enables the built-in /compact that web profiles
# disable on the host plane.
#
# Notes:
# - `name` must equal the npm package name; dsh resolves it from the profile
#   dependency and loads its default export (the Compactor Service class).
# - /compact is provided by the built-in @deepseek-ai/dsh-command-compact
#   (part of dsh-base); this plugin provides /restore + /local-compact + pruning
#   + the dead-loop guard.
# - Summarization needs: export DEEPSEEK_API_KEY=sk-...
- insert:
    - id: dsh-compactor
      name: dsh-compactor
      config:
        thresholdTokens: 32768
        targetTokens: 8192
        compressInterval: 300
        retainRecentRounds: 3
        summaryModel: deepseek-chat
        enablePruning: true
        enableSummary: true
        exemptTools:
          - write
          - edit
          - task
        qualityThreshold: 0.85
        exemptPatterns: []
        # /local-compact rules file (defaults to the package local-rules.json; can
        # also be set via $DSH_COMPACTOR_RULES)
        # localRulesPath: /path/to/my-rules.json

# Re-enable the dsh built-in manual /compact and its backend (compaction service +
# tool-result pruner). Background: the `dsh-web-app` bundle disables these rows
# (`disabled: true`) on the host plane, so a plain web profile shows no built-in
# /compact. This plugin relies on the built-in /compact (it does not re-register it),
# so it explicitly re-enables them here. Patch semantics = "later layer wins per id";
# this file applies after dsh-base / dsh-web-app, so `disabled: false` overrides
# their `disabled: true`. It is a no-op (idempotent) for non-web profiles where these
# rows are not disabled.
- id: compaction-basic
  disabled: false

- id: command-compact
  disabled: false

- id: tool-result-pruner
  disabled: false
